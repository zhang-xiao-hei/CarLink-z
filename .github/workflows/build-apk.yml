name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "platforms;android-37" \
            "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/carlink-release.jks" \
            -alias carlink \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass carlink-pass -keypass carlink-pass \
            -dname "CN=CarLink CI, O=CarLink, C=CN"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/carlink-release.jks
          ANDROID_KEYSTORE_PASSWORD: carlink-pass
          ANDROID_KEY_ALIAS: carlink
          ANDROID_KEY_PASSWORD: carlink-pass
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        id: apk
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -l out
          VERSION=$(grep -m1 'versionName = "' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          for f in out/*.apk; do
            base=$(basename "$f")
            case "$base" in
              *release*|*unsigned*) cp "$f" "out/CarLink-${VERSION}-b${GITHUB_RUN_NUMBER}-release.apk" ;;
              *) cp "$f" "out/CarLink-${VERSION}-b${GITHUB_RUN_NUMBER}-debug.apk" ;;
            esac
          done
          rm -f out/*-release-unsigned.apk
          ls -l out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "CarLink ${{ steps.apk.outputs.tag }}" \
            --notes "CI build from ${{ github.sha }} (run ${{ github.run_number }})." \
            out/CarLink-*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carlink-apk
          path: out/*.apk
          if-no-files-found: error
